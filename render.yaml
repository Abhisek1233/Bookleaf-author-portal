services:
  # Backend Node.js Express API & Real-time WebSockets
  - type: web
    name: bookleaf-api
    env: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CLIENT_ORIGIN
        value: https://bookleaf-portal.vercel.app

databases:
  # Managed PostgreSQL Database
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf_support
    user: bookleaf_user
